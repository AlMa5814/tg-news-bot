name: news

on:
  schedule:
    # время в UTC (Москва = UTC+3)
    - cron: "*/15 5-19 * * *"      # день: 08:00-22:45 по Москве, каждые 15 минут
    - cron: "0 20-23,0-4 * * *"    # ночь: 23:00-07:00 по Москве, раз в час
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Для теста: брать посты за последние N часов (например 24). Пусто = обычный режим"
        required: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          MAX_AGE_OVERRIDE: ${{ github.event.inputs.max_age_hours }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet || (git commit -m "update state" && git push)
