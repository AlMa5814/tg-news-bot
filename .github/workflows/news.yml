name: news

on:
  schedule:
    # время в UTC; бот сам различает день и ночь по московскому времени
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Для теста: брать посты за последние N часов (например 24). Пусто = обычный режим"
        required: false

permissions:
  contents: write
  models: read   # доступ к GitHub Models для запасного ИИ

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          MAX_AGE_OVERRIDE: ${{ github.event.inputs.max_age_hours }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs || git rebase --abort
              sleep 3
            done
          fi
